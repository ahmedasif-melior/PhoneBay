<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
    style="background-color:#f4f5f7; padding:24px 0;">
    <tr>
        <td align="center">
            <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0"
                style="width:600px; max-width:600px; background-color:#ffffff; border-radius:12px; overflow:hidden; border:1px solid #e6e8ec;">

                <!-- Header -->
                <tr>
                    <td align="center"
                        style="background-color:#ffffff; padding: 28px 24px 20px 24px; border-bottom:1px solid #eef0f3;">
                        <img src="https://cdn.prod.website-files.com/6aa39b8a32bcb0f30e5443c9/6aa7a8af37175f386f27298d_ynotdata-png.png"
                            width="220" alt="YNOTDATA" style="display:block; width:220px; max-width:220px;">
                    </td>
                </tr>

                <!-- Accent bar -->
                <tr>
                    <td style="background-color:#226ce0; height:3px; line-height:3px; font-size:0;">&nbsp;</td>
                </tr>

                <!-- Title -->
                <tr>
                    <td style="padding: 32px 32px 8px 32px;">
                        <span
                            style="display:inline-block; background-color:#eaf1fd; color:#226ce0; font-family:Arial, Helvetica, sans-serif; font-size:11px; font-weight:700; letter-spacing:0.06em; text-transform:uppercase; padding:6px 12px; border-radius:20px;">
                            New Submission
                        </span>
                        <h1
                            style="margin: 16px 0 0 0; font-family:Arial, Helvetica, sans-serif; font-size:20px; line-height:28px; color:#111827; font-weight:700;">
                            New form submission on {{siteName}}
                        </h1>
                        <p
                            style="margin: 8px 0 0 0; font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:20px; color:#6b7280;">
                            Submitted via the {{formName}} form.
                        </p>
                    </td>
                </tr>

                <!-- Form data -->
                <tr>
                    <td style="padding: 20px 32px 8px 32px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0"
                            style="background-color:#f8f9fb; border:1px solid #e6e8ec; border-radius:10px;">
                            <tr>
                                <td
                                    style="padding: 20px 22px; font-family:Arial, Helvetica, sans-serif; font-size:14px; line-height:24px; color:#111827; white-space:pre-line;">
                                    {{formData}}</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- CTA -->
                <tr>
                    <td align="center" style="padding: 12px;">
                       
                    </td>
                </tr>


                <!-- Divider -->
                <tr>
                    <td style="padding: 0 32px;">
                        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
                            <tr>
                                <td style="border-top:1px solid #eef0f3; font-size:0; line-height:0;">&nbsp;</td>
                            </tr>
                        </table>
                    </td>
                </tr>

                <!-- Footer -->
                <tr>
                    <td align="center" style="padding: 20px 32px 28px 32px;">
                        <p
                            style="margin:0; font-family:Arial, Helvetica, sans-serif; font-size:11px; line-height:18px; color:#9aa1ac;">
                            YNOTDATA LIMITED · 1 Hall Road, Bradford, West Yorkshire, BD2 2DP, UK
                        </p>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
